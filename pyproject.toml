[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwall"
version = "1.0.0"
description = "50 validated bug-bounty operations skills plus a queue CLI for hunters and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["bug-bounty", "operations", "agent-skills", "security", "triage"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentwall = "agentwall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"